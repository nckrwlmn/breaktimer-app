name: Build Windows Installer

# Run manually from the Actions tab, and also on every push to master.
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run package-win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BreakTimer-Windows
          path: release/BreakTimer.exe
